quarkus.application.name=gamebased-learning
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.devservices.enabled=false
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs
quarkus.http.static-resources.max-age=0S

# Development default: no external database needed.
gamebased.demo-data.enabled=false
%dev.gamebased.demo-data.enabled=true
%test.gamebased.demo-data.enabled=true
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:gamebased;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./.local-data/gamebased;DB_CLOSE_ON_EXIT=FALSE

# Optional local PostgreSQL profile; use only a local development database.
%local-pg.quarkus.datasource.db-kind=postgresql
%local-pg.quarkus.datasource.username=${DATABASE_USERNAME:gamebased}
%local-pg.quarkus.datasource.password=${DATABASE_PASSWORD:gamebased}
%local-pg.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/gamebased}
%local-pg.quarkus.flyway.locations=db/migration/postgresql
%local-pg.gamebased.smart10.persistence.enabled=true
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Flyway owns the current legacy schema in local development and tests.
quarkus.flyway.locations=db/migration/h2
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-on-validation-error=false
quarkus.flyway.repair-at-start=false
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.baseline-at-start=false

# Production on LeoCloud should use the postgres service from k8s/postgres.yaml.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DATABASE_USERNAME:gamebased}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:gamebased}
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://gamebased-learning-postgres:5432/gamebased}
%prod.quarkus.flyway.locations=db/migration/postgresql
%prod.quarkus.flyway.migrate-at-start=${FLYWAY_PROD_MIGRATE:false}
%prod.quarkus.hibernate-orm.database.generation=validate

# Keycloak/OIDC mode based on the LDAP demo from Herr Aberger.
quarkus.oidc.tenant-enabled=true
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://auth.htl-leonding.ac.at/realms/2526_5bhitm}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:frontend}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.roles.role-claim-path=custom_roles
auth.keycloak.default-role=${AUTH_KEYCLOAK_DEFAULT_ROLE:STUDENT}

# Tests do not contact the school Keycloak server.
%test.quarkus.oidc.tenant-enabled=false

# Persistent Smart10 play is local until visibility, migration and routing gates are reviewed.
gamebased.smart10.persistence.enabled=false
%dev.gamebased.smart10.persistence.enabled=true
%test.gamebased.smart10.persistence.enabled=true
%prod.gamebased.smart10.persistence.enabled=${SMART10_PERSISTENCE_ENABLED:false}

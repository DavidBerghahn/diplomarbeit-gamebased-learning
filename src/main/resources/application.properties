quarkus.application.name=gamebased-learning
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.devservices.enabled=false
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs

# Development default: no external database needed.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:gamebased;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Production on LeoCloud should use the postgres service from k8s/postgres.yaml.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DATABASE_USERNAME:gamebased}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:gamebased}
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://postgres:5432/gamebased}

# Keycloak/OIDC mode based on the LDAP demo from Herr Aberger.
quarkus.oidc.tenant-enabled=true
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://auth.htl-leonding.ac.at/realms/2526_5bhitm}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:frontend}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.roles.role-claim-path=custom_roles
auth.keycloak.default-role=${AUTH_KEYCLOAK_DEFAULT_ROLE:STUDENT}

# Tests do not contact the school Keycloak server.
%test.quarkus.oidc.tenant-enabled=false

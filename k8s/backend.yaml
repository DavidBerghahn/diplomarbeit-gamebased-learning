apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamebased-learning-web
  labels:
    app: gamebased-learning-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamebased-learning-web
  template:
    metadata:
      labels:
        app: gamebased-learning-web
    spec:
      containers:
        - name: gamebased-learning-web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: gamebased-learning-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: gamebased-learning-web
  labels:
    app: gamebased-learning-web
spec:
  selector:
    app: gamebased-learning-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamebased-learning-web-content
data:
  index.html: |-
    <!doctype html>
    <html lang="de">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Game-based Learning Diplomarbeit</title>
        <link rel="stylesheet" href="/styles.css">
      </head>
      <body>
        <main class="page">
          <section class="intro">
            <p class="eyebrow">HTL Leonding Diplomarbeit</p>
            <h1>Game-based Learning Plattform</h1>
            <p class="lead">
              Eine KI-gestuetzte Spieleplattform, mit der Lerninhalte spielerisch geuebt,
              Fortschritte gespeichert und Rollen fuer Schueler:innen und Lehrer:innen
              vorbereitet werden.
            </p>
            <div class="status-grid">
              <article>
                <span>Deployment</span>
                <strong>LeoCloud vorbereitet</strong>
              </article>
              <article>
                <span>Host</span>
                <strong>it220269.cloud.htl-leonding.ac.at</strong>
              </article>
              <article>
                <span>Naechster Schritt</span>
                <strong>Backend und Schul-Login</strong>
              </article>
            </div>
          </section>
        </main>
      </body>
    </html>
  styles.css: |-
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(16, 185, 129, 0.16), transparent 36%),
        #f6f7fb;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .intro {
      width: min(960px, 100%);
      padding: clamp(28px, 7vw, 72px);
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 22px 70px rgba(23, 32, 51, 0.12);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #2563eb;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5.6rem);
      line-height: 0.96;
    }

    .lead {
      max-width: 720px;
      margin: 24px 0 0;
      color: #40506f;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.6;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }

    article {
      min-height: 108px;
      padding: 18px;
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 8px;
      background: #ffffff;
    }

    article span {
      display: block;
      color: #66708a;
      font-size: 0.86rem;
    }

    article strong {
      display: block;
      margin-top: 10px;
      font-size: 1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .status-grid {
        grid-template-columns: 1fr;
      }
    }

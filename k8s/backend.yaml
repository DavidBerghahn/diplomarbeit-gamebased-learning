apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamebased-learning-api
  labels:
    app: gamebased-learning-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamebased-learning-api
  template:
    metadata:
      labels:
        app: gamebased-learning-api
    spec:
      containers:
        - name: gamebased-learning-api
          image: ghcr.io/davidberghahn/diplomarbeit-gamebased-learning:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: "prod"
            - name: AUTH_PROVIDER
              value: "mock"
            - name: DATABASE_JDBC_URL
              value: "jdbc:postgresql://gamebased-learning-postgres:5432/gamebased"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gamebased-learning-postgres-secret
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamebased-learning-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gamebased-learning-api
  labels:
    app: gamebased-learning-api
spec:
  selector:
    app: gamebased-learning-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

apiVersion: v1
kind: Secret
metadata:
  name: gamebased-learning-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: gamebased
  POSTGRES_USER: gamebased
  POSTGRES_PASSWORD: gamebased
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gamebased-learning-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamebased-learning-postgres
  labels:
    app: gamebased-learning-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamebased-learning-postgres
  template:
    metadata:
      labels:
        app: gamebased-learning-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: gamebased-learning-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gamebased-learning-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: gamebased-learning-postgres
  labels:
    app: gamebased-learning-postgres
spec:
  selector:
    app: gamebased-learning-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP

<main class="login-page">
  <section class="login-panel">
    <p class="eyebrow">HTL Leonding</p>
    <h1>Mit Schulaccount anmelden</h1>
    <p>
      Nach dem Login wird dein Schulaccount im Backend als App-User verwendet.
    </p>

    @if (profile) {
      <div class="profile-box">
        <strong>{{ profile.displayName }}</strong>
        <span>{{ profile.username }} · {{ profile.role }}</span>
      </div>
      <div class="action-row">
        <button type="button" class="primary-link" (click)="continueToPlatform()">Weiter zur Plattform</button>
        <button type="button" class="secondary-link" (click)="toggleDebug()">
          {{ debugVisible ? 'Login-Details ausblenden' : 'Login-Details anzeigen' }}
        </button>
      </div>

      @if (debugVisible) {
        <pre class="debug-output">{{ debugText }}</pre>
      }
    } @else {
      <button type="button" (click)="login()">Login starten</button>
    }

    @if (message) {
      <p class="message">{{ message }}</p>
    }
  </section>
</main>

# use h2 - database
## start local H2 server first:
## Windows: h2-start.cmd
## Linux/macOS: ./h2-start.sh

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost:9092/./db
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# quarkus.datasource.username=h2
# quarkus.datasource.password=h2
# quarkus.datasource.jdbc.url=jdbc:h2:mem:db
# quarkus.datasource.jdbc.url=jdbc:h2:file:./db/db;DB_CLOSE_DELAY=-1

# show executed sql-statements
quarkus.hibernate-orm.log.sql=true

# Set default Path for RestAssured
# quarkus.rest.path=/api

# change server default port
# quarkus.http.port=9080

# enable cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

